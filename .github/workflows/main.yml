name: "⚡ NEXUS OMEGA - Auto-Heal & Deploy"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Sécurité : Le token n'a que les droits de lecture par défaut
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ============================================================================
  # JOB 1 : AUTO-REPAIR (Nettoyage du code)
  # ============================================================================
  auto_repair:
    name: "🔧 Usine de Nettoyage"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changes_made: ${{ steps.check_changes.outputs.changes }}

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Cache conditionnel : ne plante pas si le fichier n'existe pas
          cache: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' && 'pip' || '' }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock') != '' && 'npm' || '' }}

      - name: "Install Tools"
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 autoflake
          if [ -f "package.json" ]; then npm install -g prettier eslint; fi

      - name: "Cleanup Python"
        continue-on-error: true
        run: |
          # On vérifie s'il y a des fichiers .py avant de lancer les outils
          if find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.git/*" | grep -q .; then
            find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/venv/*" -exec autoflake --in-place --remove-all-unused-imports --remove-unused-variables {} + || true
            find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/venv/*" -exec isort {} + || true
            find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/venv/*" -exec black -S {} + || true
          fi

      - name: "Cleanup Web"
        continue-on-error: true
        run: |
          if [ -f "package.json" ]; then
            npx prettier --write "**/*.{js,jsx,ts,tsx,css,scss,json,yml,yaml,md}" --ignore-path .gitignore || true
            npx eslint --fix "**/*.{js,jsx,ts,tsx}" --ignore-path .gitignore || true
          fi

      - name: "Check Changes"
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: "Create PR"
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "⚡ NEXUS OMEGA : Auto-Réparation"
          title: "🩺 Auto-Réparation : Code Nettoyé"
          branch: nexus-omega/repair-${{ github.run_id }}
          delete-branch: true

  # ============================================================================
  # JOB 2 : BUILD & TEST (LE JOB QUI PLANTAIT)
  # ============================================================================
  build_and_test:
    name: "🏗️ Construction et test Souverain"
    runs-on: ubuntu-latest
    needs: auto_repair
    # On exécute si le code est propre, ou si c'est une PR
    if: needs.auto_repair.outputs.changes_made == 'false' || github.event_name == 'pull_request'

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ hashFiles('requirements.txt', 'pyproject.toml') != '' && 'pip' || '' }}

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: "Install Dependencies"
        run: |
          # VÉRIFICATION STRICTE : On installe seulement si le fichier existe
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          
          if [ -f "pyproject.toml" ]; then
            pip install .
          fi
          
          if [ -f "package.json" ]; then
            npm ci || npm install
          fi
          
          echo "Étape d'installation terminée avec succès."

      - name: "Run Tests"
        run: |
          # VÉRIFICATION STRICTE : On lance pytest seulement si le dossier tests existe
          if [ -d "tests" ] && find tests -name "*.py" | grep -q .; then
            pytest tests/ -v --tb=short
          else
            echo "Pas de tests à exécuter (dossier 'tests/' vide ou absent)."
          fi

      - name: "Node Build"
        run: |
          # VÉRIFICATION STRICTE : On build seulement si le script existe
          if [ -f "package.json" ] && grep -q "\"build\"" package.json; then
            npm run build
          else
            echo "Pas de script 'build' trouvé."
          fi

  # ============================================================================
  # JOB 3 : DEPLOY
  # ============================================================================
  deploy:
    name: "🚀 Déploiement Souverain"
    runs-on: ubuntu-latest
    needs: [auto_repair, build_and_test]
    if: github.ref == 'refs/heads/main' && needs.build_and_test.result == 'success'

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Prepare Artifact"
        run: |
          mkdir -p dist
          echo "Build info - ${{ github.sha }}" > dist/build-info.txt

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: nexus-omega-build
          path: dist/
